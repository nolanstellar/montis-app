# Construit et publie Montis pour Mac (Apple Silicon + Intel), Windows et Linux à chaque étiquette « v* ».
# La version publiée porte les installateurs et latest.json (mise à jour automatique dans l'application).
name: Publier Montis
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Dépendances Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - run: npm ci
      # Notarisation Apple par clé d'API App Store Connect (pas de mot de passe Apple ID) : le contenu du fichier .p8 est un secret,
      # écrit dans un fichier le temps de la construction.
      - name: Clé de notarisation Apple
        if: matrix.platform == 'macos-latest' && env.CLE != ''
        env: { CLE: "${{ secrets.APPLE_API_KEY_CONTENT }}" }
        run: printf '%s' "$CLE" > "$RUNNER_TEMP/AuthKey.p8" && echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Signature Developer ID (certificat exporté en .p12, base64) et notarisation par clé d'API. Sans ces secrets la construction
          # macOS reste non signée : macOS dit « endommagé » et oublie les autorisations à chaque mise à jour.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Montis ${{ github.ref_name }}"
          releaseBody: "Installateurs Mac (.dmg), Windows (.exe / .msi) et Linux (.AppImage / .deb). Version non signée : Mac → clic droit › Ouvrir ; Windows → « Informations complémentaires » › « Exécuter quand même »."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
