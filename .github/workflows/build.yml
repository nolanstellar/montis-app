# Construit et publie Montis pour Mac (Apple Silicon + Intel), Windows et Linux à chaque étiquette « v* ».
# La version publiée porte les installateurs et latest.json (mise à jour automatique dans l'application).
name: Publier Montis
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS n'est plus construit ici : la version Mac est signée (Developer ID) et notarisée sur le Mac de l'éditeur, puis ajoutée
          # à la publication à la main (voir README, « Publier la version Mac »). Les secrets APPLE_* restent prêts pour y revenir.
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Dépendances Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - run: npm ci
      # Notarisation Apple par clé d'API App Store Connect (pas de mot de passe Apple ID) : le contenu du fichier .p8 est un secret,
      # écrit dans un fichier le temps de la construction.
      - name: Clé de notarisation Apple
        if: matrix.platform == 'macos-latest' && env.CLE != ''
        env: { CLE: "${{ secrets.APPLE_API_KEY_CONTENT }}" }
        run: printf '%s' "$CLE" > "$RUNNER_TEMP/AuthKey.p8" && echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Signature Developer ID (certificat exporté en .p12, base64) et notarisation par clé d'API. Sans ces secrets la construction
          # macOS reste non signée : macOS dit « endommagé » et oublie les autorisations à chaque mise à jour.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Montis ${{ github.ref_name }}"
          releaseBody: "Montis pour Mac (universel, signé et notarisé) : Montis-Mac.dmg. Montis pour Windows : Montis-Windows-setup.exe (non signé : « Informations complémentaires » › « Exécuter quand même »). Adresses stables de la dernière version : https://github.com/nolanstellar/montis-app/releases/latest/download/Montis-Mac.dmg et https://github.com/nolanstellar/montis-app/releases/latest/download/Montis-Windows-setup.exe"
          releaseDraft: false
          # CANAL : un tag « -beta » publie une PRÉ-VERSION (canal bêta, application « Montis Bêta ») ; un tag sans suffixe publie la version
          # stable, que seul « publie en stable » déclenche. L'application stable suit releases/latest (les pré-versions n'y entrent jamais).
          prerelease: ${{ contains(github.ref_name, '-beta') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }} ${{ contains(github.ref_name, '-beta') && '--config src-tauri/tauri.beta.conf.json' || '' }}
      # ADRESSE STABLE : une copie de l'installateur Windows sous un nom sans version, pour que le site pointe toujours vers
      # https://github.com/nolanstellar/montis-app/releases/latest/download/Montis-Windows-setup.exe
      - name: Adresse stable Windows
        if: matrix.platform == 'windows-latest' && !contains(github.ref_name, '-beta')
        shell: pwsh
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $exe.FullName Montis-Windows-setup.exe
          gh release upload "${{ github.ref_name }}" Montis-Windows-setup.exe --clobber
      # CANAL BÊTA : la publication mobile « beta » porte toujours le latest.json de la dernière pré-version — c'est elle que suit « Montis Bêta ».
      - name: Canal bêta (latest.json)
        if: matrix.platform == 'windows-latest' && contains(github.ref_name, '-beta')
        shell: pwsh
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release view beta 2>$null; if ($LASTEXITCODE -ne 0) { gh release create beta --prerelease --title "Canal bêta (Montis Bêta)" --notes "Publication mobile : latest.json de la dernière pré-version. Ne pas supprimer." }
          gh release download "${{ github.ref_name }}" -p latest.json -D . --clobber
          gh release upload beta latest.json --clobber
